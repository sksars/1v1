function movePlayer(dt,now){if(player.dead){if(now>respawnAt){player.dead=false;health=100;resetChar(player,slot===0?-5:5,rnd(-3,3));player.hp=100}return}const ix=clamp((keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,-1,1),iz=clamp((keys.KeyW?1:0)-(keys.KeyS?1:0)+joy.y,-1,1),moving=Math.hypot(ix,iz)>.08;player.crouch=crouchDown||!!keys.KeyC;const speed=player.crouch?1.8:((runDown||keys.ShiftLeft)?4.8:3.2);const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);if(moving){const l=Math.hypot(ix,iz)||1;player.pos.x+=(fx*iz+rx*ix)/l*speed*dt;player.pos.z+=(fz*iz+rz*ix)/l*speed*dt;player.pos.x=clamp(player.pos.x,-19,19);player.pos.z=clamp(player.pos.z,-19,19);player.face=Math.atan2(fx*iz+rx*ix,fz*iz+rz*ix);if(!fireDown&&!aimDown)player.group.rotation.y=player.face}if(jumpDown&&!player.air){player.vy=6.5;player.air=true}player.vy-=16*dt;player.pos.y+=player.vy*dt;if(player.pos.y<=0){player.pos.y=0;player.vy=0;player.air=false}player.group.position.set(player.pos.x,player.pos.y-(player.crouch?.12:0),player.pos.z);player.group.rotation.y=player.face;anim(player,now,moving);camera.position.set(player.pos.x+Math.sin(yaw)*4,player.pos.y+2.3,player.pos.z+Math.cos(yaw)*4);camera.lookAt(player.pos.x,player.pos.y+1.15+pitch*2,player.pos.z);}
function botUpdate(dt,now){if(!offline||!started||over||enemy.dead)return;const dx=player.pos.x-enemy.pos.x,dz=player.pos.z-enemy.pos.z,d=Math.hypot(dx,dz)||1;const moving=d>5;if(moving){enemy.pos.x+=dx/d*1.5*dt;enemy.pos.z+=dz/d*1.5*dt}enemy.face=Math.atan2(dx,dz);enemy.group.position.copy(enemy.pos);enemy.group.rotation.y=enemy.face;anim(enemy,now,moving);if(d<15&&now>botShot){botShot=now+rnd(.6,1.2);if(Math.random()<.58)takeDamage(8)}if(d<1.5){enemy.pos.x-=dx/d*.8*dt;enemy.pos.z-=dz/d*.8*dt}}
function shoot(now){if(!started||over||player.dead||reloadEnd>now||now<nextShot)return;if(ammo<=0){reload(now);return}ammo--;nextShot=now+.24;lastShot=now;if(player.muzzleFlash)player.muzzleFlash.visible=true;const origin=camera.position.clone(),dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();const target=new THREE.Vector3(enemy.pos.x,enemy.pos.y+1,enemy.pos.z);const to=target.sub(origin),t=to.dot(dir),dist=to.clone().addScaledVector(dir,-t).length();let damage=0;if(t>0&&t<40&&dist<.85&&!enemy.dead){damage=25;if(offline){enemy.hp-=damage;if(enemy.hp<=0){enemy.hp=0;enemy.dead=true;enemy.deathStart=now;enemy.deathSide=Math.random()<.5?-1:1;enemy.mixer.stopAllAction();scoreA++;setScore();say('ENEMY ELIMINATED');setTimeout(()=>{if(started&&!over){resetChar(enemy,rnd(-9,9),rnd(-9,9));enemy.hp=100}},1250)}}else if(evRef)evRef.push({slot,type:'shot',x:origin.x,y:origin.y,z:origin.z,ex:origin.x+dir.x*40,ey:origin.y+dir.y*40,ez:origin.z+dir.z*40,damage}).catch(()=>{})}else if(!offline&&evRef)evRef.push({slot,type:'shot',x:origin.x,y:origin.y,z:origin.z,ex:origin.x+dir.x*40,ey:origin.y+dir.y*40,ez:origin.z+dir.z*40,damage:0}).catch(()=>{});if(damage){$('enemyhp').style.width=Math.max(0,enemy.hp)+'%'}$('ammo').textContent=ammo+' / 30';if(ammo===0)say('Magazine empty — reload')}
function takeDamage(n){if(!started||over||player.dead)return;health=Math.max(0,health-n);player.hp=health;$('health').style.width=health+'%';$('healthN').textContent=health;$('hurt').style.opacity='.75';damageFlash=.18;if(health<=0){player.dead=true;player.deathStart=performance.now()/1000;player.deathSide=Math.random()<.5?-1:1;player.mixer.stopAllAction();respawnAt=player.deathStart+1.35;scoreB++;setScore();say('YOU WERE ELIMINATED');if(!offline&&evRef)evRef.push({slot,type:'kill'}).catch(()=>{});if(scoreB>=10)endGame(false)}}
function reload(now=performance.now()/1000){if(reloadEnd>now||ammo===30)return;reloadEnd=now+1.35;setTimeout(()=>{if(started&&reloadEnd){ammo=30;reloadEnd=0;$('ammo').textContent=ammo+' / 30'}},1350);say('Reloading…')}
function endGame(win){over=true;started=false;say(win?'YOU WIN!':'YOU LOSE');setTimeout(()=>{if(over){$('menu').style.display='flex';document.body.classList.remove('playing');setNote(win?'VICTORY — start a new match':'DEFEAT — try again')}} ,1000)}
function syncNetwork(dt,now){if(offline||!room||!db||now-lastNet<.12)return;lastNet=now;const my=db.ref('rooms/'+room+'/p'+slot);my.update({ready:true,x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.face,hp:health,dead:player.dead,score:scoreA,stamp:Date.now()}).catch(()=>{});if(enemy.tx!==undefined){enemy.pos.x+=(enemy.tx-enemy.pos.x)*Math.min(1,dt*12);enemy.pos.z+=(enemy.tz-enemy.pos.z)*Math.min(1,dt*12);enemy.group.position.copy(enemy.pos);enemy.face=enemy.tf;enemy.group.rotation.y=enemy.face;anim(enemy,now,Math.abs(enemy.tx-enemy.pos.x)+Math.abs(enemy.tz-enemy.pos.z)>.02)}}
function frame(){const now=performance.now()/1000,dt=Math.min(.04,Math.max(0,now-lastTime));lastTime=now;if(started&&!over){movePlayer(dt,now);if(offline)botUpdate(dt,now);else syncNetwork(dt,now);animateDeath(player,now);animateDeath(enemy,now);if(player.muzzleFlash)player.muzzleFlash.visible=now<lastShot+.065;if(fireDown&&now>=nextShot)shoot(now);if(damageFlash>0){damageFlash-=dt;$('hurt').style.opacity=String(Math.max(0,damageFlash/.18)*.75)}$('health').style.width=health+'%';$('healthN').textContent=health;$('ammo').textContent=reloadEnd>now?'RELOADING…':ammo+' / 30';$('enemyhp').style.width=Math.max(0,enemy.hp)+'%';if(scoreA>=10)endGame(true);if(scoreB>=10)endGame(false)}player?.mixer.update(dt);enemy?.mixer.update(dt);renderer.render(scene,camera)}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){jumpDown=true;e.preventDefault()}if(e.code==='KeyR')reload();if(e.code==='Escape'&&started&&!touch){}});
document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')jumpDown=false});
renderer.domElement.addEventListener('mousedown',e=>{if(!started)return;if(e.button===0){fireDown=true;if(!document.pointerLockElement&&!touch)renderer.domElement.requestPointerLock?.()}if(e.button===2)aimDown=true});addEventListener('mouseup',e=>{if(e.button===0)fireDown=false;if(e.button===2)aimDown=false});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('mousemove',e=>{if(!started||touch)return;if(document.pointerLockElement){yaw-=e.movementX*.0022;pitch=clamp(pitch-e.movementY*.002,-.85,.65)}});
renderer.domElement.addEventListener('touchstart',e=>{if(!started)return;for(const t of e.changedTouches){if(t.clientX>innerWidth*.38){lookId=t.identifier;lastTouch={x:t.clientX,y:t.clientY}}}},{passive:false});renderer.domElement.addEventListener('touchmove',e=>{if(!started)return;for(const t of e.changedTouches)if(t.identifier===lookId){yaw-=(t.clientX-lastTouch.x)*.007;pitch=clamp(pitch-(t.clientY-lastTouch.y)*.006,-.85,.65);lastTouch={x:t.clientX,y:t.clientY}}},{passive:false});renderer.domElement.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null});
const stick=$('stick'),knob=$('knob');stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);joyFrom(e);e.preventDefault()});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)joyFrom(e)});function joyFrom(e){const r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=Math.min(36,d),a=Math.atan2(y,x);joy.x=Math.cos(a)*m/36;joy.y=Math.sin(a)*m/36;knob.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}function stopStick(){stickId=null;joy.x=joy.y=0;knob.style.transform=''}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
function hold(id,on,off){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);on();el.style.filter='brightness(1.5)'});const end=e=>{off();el.style.filter='';};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)}
hold('fire',()=>fireDown=true,()=>fireDown=false);hold('jump',()=>jumpDown=true,()=>jumpDown=false);hold('reload',()=>reload(),()=>{});hold('run',()=>runDown=true,()=>runDown=false);hold('crouch',()=>crouchDown=true,()=>crouchDown=false);hold('aim',()=>aimDown=true,()=>aimDown=false);
