addEventListener('keydown',e=>{const m=KM[e.code];if(m){e.preventDefault();if(!e.repeat)setK(m[0],m[1],1)}});
addEventListener('keyup',e=>{const m=KM[e.code];if(m)setK(m[0],m[1],0)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();setK(0,k,1)});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>setK(0,k,0)))});
const CAM={x:0,d:6,az:0,h:1.5,zoom:1},pts=new Map(),cv=R.domElement,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
cv.addEventListener('pointerdown',e=>pts.set(e.pointerId,[e.clientX,e.clientY]));
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
 if(pts.size===1){let ax=e.clientX-p[0],ay=e.clientY-p[1];if(ROT){const t=ax;ax=ay;ay=-t}CAM.az=cl(CAM.az-ax*.004,-.8,.8);CAM.h=cl(CAM.h+ay*.006,.6,3.2)}
 else{const o=[...pts].find(([id])=>id!==e.pointerId)[1],d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);if(d1>5)CAM.zoom=cl(CAM.zoom*d0/d1,.6,1.8)}
 p[0]=e.clientX;p[1]=e.clientY});
['pointerup','pointercancel','pointerleave'].forEach(v=>cv.addEventListener(v,e=>pts.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{CAM.zoom=cl(CAM.zoom*(1+e.deltaY*.001),.6,1.8)},{passive:true});
$('cr').onclick=()=>{CAM.az=0;CAM.h=1.5;CAM.zoom=1};
const joy=$('joy'),kn=$('knob');let jp=null;
function jset(e){const r=joy.getBoundingClientRect(),h=r.width/2;let dx=e.clientX-(r.left+h),dy=e.clientY-(r.top+h);if(ROT){const t=dx;dx=dy;dy=-t}const m=Math.hypot(dx,dy);if(m>h){dx*=h/m;dy*=h/m}
 kn.style.transform='translate('+dx+'px,'+dy+'px)';setK(0,'l',dx<-h*.3);setK(0,'r',dx>h*.3);setK(0,'u',dy<-h*.55);setK(0,'d',dy>h*.55)}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jp=e.pointerId;joy.setPointerCapture(e.pointerId);jset(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jp)jset(e)});
const jend=e=>{if(e.pointerId!==jp)return;jp=null;kn.style.transform='';['l','r','u','d'].forEach(k=>setK(0,k,0))};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
loop();
</script></body></html>
